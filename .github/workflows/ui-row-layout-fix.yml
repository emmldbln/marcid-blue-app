name: Daily Closing UI Row Layout

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ui-row-layout-fix.yml'

permissions:
  contents: write

jobs:
  update-layout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update daily closing row layout
        shell: python
        run: |
          from pathlib import Path

          path = Path('pages/daily-closing.php')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  """    .expense-rows,\n    .delivery-payment-rows {\n        display: flex;\n        flex-direction: column;\n        gap: 12px;\n    }""",
                  """    .expense-rows,\n    .delivery-payment-rows {\n        display: flex;\n        flex-direction: column;\n        gap: 0;\n\n        padding: 0 16px;\n\n        background: var(--background);\n        border: 1px solid var(--border);\n        border-radius: var(--radius-md);\n    }"""
              ),
              (
                  """        padding: 16px;\n\n        background: var(--background);\n        border: 1px solid var(--border);\n        border-radius: var(--radius-md);\n    }\n\n\n    /* =========================================================\n       DELIVERY PAYMENT ROW""",
                  """        padding: 16px 0;\n\n        background: transparent;\n        border: 0;\n        border-radius: 0;\n    }\n\n    .expense-row + .expense-row,\n    .delivery-payment-row + .delivery-payment-row {\n        border-top: 1px solid var(--border);\n    }\n\n\n    /* =========================================================\n       DELIVERY PAYMENT ROW"""
              ),
              (
                  """        padding: 16px;\n\n        background: var(--background);\n        border: 1px solid var(--border);\n        border-radius: var(--radius-md);\n    }\n\n\n    /* =========================================================\n       FORM GROUPS""",
                  """        padding: 16px 0;\n\n        background: transparent;\n        border: 0;\n        border-radius: 0;\n    }\n\n\n    /* =========================================================\n       FORM GROUPS"""
              )
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Expected CSS block was not found; stopping without changes.')
              text = text.replace(old, new, 1)

          marker = """    /* =========================================================\n       FORM GROUPS\n       ========================================================= */"""
          label_css = """\n\n    @media (min-width: 901px) {\n        .expense-row:not(:first-child) .form-label,\n        .delivery-payment-row:not(:first-child) .form-label {\n            display: none;\n        }\n    }\n"""

          if label_css.strip() not in text:
              if marker not in text:
                  raise SystemExit('Form group CSS marker was not found; stopping without changes.')
              text = text.replace(marker, marker + label_css, 1)

          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Verify formatting and diff scope
        run: |
          git diff --check
          git diff -- pages/daily-closing.php

      - name: Commit layout update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/daily-closing.php
          git rm .github/workflows/ui-row-layout-fix.yml
          git commit -m "fix: improve expense and payment row layout"
          git push origin main
