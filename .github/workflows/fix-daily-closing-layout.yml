name: Apply Daily Closing Layout Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-layout:
    if: ${{ !contains(github.event.head_commit.message, 'fix: improve daily closing shop summary spacing') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update CSS layout
        shell: python
        run: |
          from pathlib import Path

          path = Path('pages/daily-closing.php')
          text = path.read_text(encoding='utf-8')

          old_layout = '''    .shop-walkin-layout {
        display: grid;
        grid-template-columns:
            minmax(110px, 0.65fr)
            minmax(190px, 1fr)
            minmax(180px, 1fr);
        gap: 18px;
        align-items: end;
    }

    .shop-sales-summary-group {
        display: grid;
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
        gap: 18px;
        align-items: end;
    }

    .shop-computed-sales,
    .shop-other-sales {
        padding: 8px 0 4px 8px;
    }

    .shop-computed-sales .summary-value,
    .shop-other-sales .summary-value {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.4;
    }
'''

          new_layout = '''    .shop-walkin-layout {
        display: grid;
        grid-template-columns:
            minmax(220px, 1.25fr)
            minmax(190px, 1fr)
            minmax(220px, 1.15fr)
            minmax(220px, 1.15fr);
        gap: 24px;
        align-items: end;
    }

    .shop-sales-summary-group {
        display: contents;
    }

    .shop-computed-sales,
    .shop-other-sales {
        min-width: 0;
        padding: 8px 0 4px 8px;
    }

    .shop-computed-sales .summary-value,
    .shop-other-sales .summary-value {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.4;
    }
'''

          if old_layout not in text:
              raise SystemExit('Expected shop layout CSS was not found; no changes made.')
          text = text.replace(old_layout, new_layout, 1)

          old_tablet = '''        .shop-sales-summary-group {
            grid-column: 1 / -1;
        }

'''
          if old_tablet not in text:
              raise SystemExit('Expected tablet shop summary rule was not found; no changes made.')
          text = text.replace(old_tablet, '', 1)

          old_mobile = '''        .shop-sales-summary-group {
            grid-template-columns: 1fr;
        }

'''
          if old_mobile not in text:
              raise SystemExit('Expected mobile shop summary rule was not found; no changes made.')
          text = text.replace(old_mobile, '', 1)

          path.write_text(text, encoding='utf-8', newline='')

      - name: Verify only intended CSS changed
        shell: bash
        run: |
          git diff --check
          git diff -- pages/daily-closing.php
          test "$(git diff --numstat -- pages/daily-closing.php | awk '{print $1+$2}')" -eq 11

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/daily-closing.php
          git rm .github/workflows/fix-daily-closing-layout.yml
          git commit -m "fix: improve daily closing shop summary spacing"
          git push